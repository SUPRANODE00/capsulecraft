<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D3M13N // Infernal 3D Craft Grid Window</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; color: #ff3300; font-family: monospace; }
        #info { position: absolute; top: 15px; left: 15px; z-index: 10; pointer-events: none; text-shadow: 0 0 8px #ff0000; }
    </style>
</head>
<body>
    <div id="info">
        <h3>[D3M13N-OS] SPATIAL GRID WINDOW // ACTIVE</h3>
        <p>Coordinate Matrix: Spherical // Theme: Infernal Void</p>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const gridGroup = new THREE.Group();
        
        const size = 50;
        const divisions = 50;
        const gridHelper = new THREE.GridHelper(size, divisions, 0xff0000, 0x440000);
        gridHelper.position.y = -2;
        gridGroup.add(gridHelper);

        const geometry = new THREE.BoxGeometry(20, 10, 20, 10, 5, 10);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0xff3300, 
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });
        const craftWindow = new THREE.Mesh(geometry, material);
        craftWindow.position.y = 5;
        gridGroup.add(craftWindow);

        scene.add(gridGroup);

        const ambientLight = new THREE.AmbientLight(0xff1100, 0.8);
        scene.add(ambientLight);

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            gridGroup.rotation.y = elapsedTime * 0.1;
            craftWindow.rotation.x = Math.sin(elapsedTime * 0.2) * 0.1;
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
