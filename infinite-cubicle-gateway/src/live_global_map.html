<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SL1TH3R 𖤐 RAINBOW - Live Global Map Telemetry</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin:0; background:#000; color:#ff0033; font-family:monospace; }
        #map { height: 100vh; width: 100vw; }
        #hud { position:absolute; top:10px; left:10px; z-index:1000; background:rgba(0,0,0,0.8); border:1px solid #ff0033; padding:10px; }
    </style>
</head>
<body>
    <div id="hud">
        <strong>[NODE] SL1TH3R-RAINBOW-42-4319484</strong><br>
        <span>Status: LIVE MESH TRACKING</span><br>
        <span id="coords">Lat: 29.6044, Lon: -95.2750</span>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([29.6044, -95.2750], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
        var marker = L.marker([29.6044, -95.2750]).addTo(map).bindPopup('<b>Active Node Origin</b>').openPopup();
        setInterval(function() {
            var newLat = 29.6044 + (Math.random() - 0.5) * 0.001;
            var newLon = -95.2750 + (Math.random() - 0.5) * 0.001;
            marker.setLatLng([newLat, newLon]);
            map.panTo([newLat, newLon]);
            document.getElementById('coords').innerText = 'Lat: ' + newLat.toFixed(4) + ', Lon: ' + newLon.toFixed(4);
        }, 5000);
    </script>
</body>
</html>
